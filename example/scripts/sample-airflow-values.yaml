executor: KubernetesExecutor

iamges:
  airflow:
    repository: ~

redis:
    enabled: false

data:
  metadataSecretName: ~
  
webserver:
  defaultUser:
    enabled: false

  service:
    type: ClusterIP
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
    waitForMigrations:
      enabled: true
    startupProbe:
      timeoutSeconds: 40
      scheme: HTTP
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 30


scheduler:
  enabled: true
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"	
    waitForMigrations:
      enabled: true

logs:
  persistence:
    enabled: true
    size: "1Gi"

createUserJob:
  useHelmHooks: false
  applyCustomEnv: true
  env:
    - name: ADMIN_ROLE
      valueFrom:
        secretKeyRef:
          name: airflow-admin-creds
          key: role
    - name: ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: airflow-admin-creds
          key: username
    - name: ADMIN_EMAIL
      valueFrom:
        secretKeyRef:
          name: airflow-admin-creds
          key: email
    - name: ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-admin-creds
          key: password
    - name: ADMIN_FIRSTNAME
      valueFrom:
        secretKeyRef:
          name: airflow-admin-creds
          key: firstname
    - name: ADMIN_LASTNAME
      valueFrom:
        secretKeyRef:
          name: airflow-admin-creds
          key: lastname          
  args:
    - "bash"
    - "-c"
    # The format below is necessary to get `helm lint` happy
    - |-
      exec \
      airflow {{ semverCompare ">=2.0.0" .Values.airflowVersion | ternary "users create" "create_user" }} "$@"
    - --
    - "-r"
    - "$(ADMIN_ROLE)"
    - "-u"
    - "$(ADMIN_USERNAME)"
    - "-e"
    - "$(ADMIN_PASSWORD)"
    - "-f"
    - "$(ADMIN_FIRSTNAME)"
    - "-l"
    - "$(ADMIN_LASTNAME)"
    - "-p"
    - "$(ADMIN_PASSWORD)"
